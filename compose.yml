services:
  backend:
    image: social-network-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: social-network-backend
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - backend-data:/app
      - backend-uploads:/app/uploads
    networks:
      - social-network

  frontend:
    image: social-network-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: social-network-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"
    networks:
      - social-network

  caddy:
    image: caddy:2-alpine
    container_name: social-network-caddy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "8000:80"
    volumes:
      - ./caddy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
    networks:
      - social-network

networks:
  social-network:

volumes:
  backend-data:
  backend-uploads:
