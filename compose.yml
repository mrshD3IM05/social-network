services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: social-network-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # The database lives in its own directory so the volume below no longer
      # has to be mounted over /app, which shadowed the image's own files.
      DB_PATH: /app/data/sn.db
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - social-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: social-network-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - social-network

  caddy:
    image: caddy:2-alpine
    container_name: social-network-caddy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./caddy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - social-network

networks:
  social-network:

volumes:
  backend-data:
  backend-uploads:
  caddy_data:
  caddy_config:
